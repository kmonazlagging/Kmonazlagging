<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kurisu Compiled Site</title>
  <link rel="stylesheet" href="kurisu-style.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>Compiled Site</h1>
      <p>This page collects the login section and pagination navigation for the files in this folder.</p>
    </header>

    <section>
      <h2>Login Page</h2>
      <form action="kurisu-pagination.html" method="get">
        <label for="login-user">Username</label>
        <input id="login-user" name="login-user" type="text" placeholder="Username" />

        <label for="login-pass">Password</label>
        <input id="login-pass" name="login-pass" type="password" placeholder="Password" />

        <button type="submit">Login</button>
      </form>
    </section>


  </div>
</body>
</html>
