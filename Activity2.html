<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Famous Website Buttons</title>
  <style>
    :root {
      --bg: #09090d;
      --surface: #111218;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: rgba(255, 255, 255, 0.15);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, system-ui, sans-serif;
      background: radial-gradient(circle at top left, #16161e 0%, #0b0b12 45%, #09090d 100%);
      background-color: var(--bg);
      bgcolor: #09090d;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
    }

    .composition {
      width: min(100%, 980px);
      background: var(--bg);
      border-radius: 28px;
      padding: 36px;
      display: grid;
      gap: 28px;
      box-shadow: 0 32px 80px rgba(0, 0, 0, 0.45);
    }

    .composition h1 {
      margin: 0;
      font-size: 1.8rem;
      letter-spacing: -0.03em;
      color: #fff;
    }

    .composition p {
      margin: 10px 0 0;
      color: var(--muted);
      line-height: 1.6;
    }

    .grid {
      display: grid;
      gap: 18px;
    }

    .top-row,
    .middle-row,
    .bottom-row {
      display: grid;
      gap: 18px;
    }

    .top-row {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .middle-row {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .bottom-row {
      grid-template-columns: 1fr;
    }

    .panel {
      background: #fff;
      border-radius: 28px;
      padding: 22px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 120px;
      border: 1px solid var(--border);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.14);
    }

    .button-frame {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 72px;
    }

    .button-group {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
      align-items: middle;
      width: 100%;
      float: none;
    }

    .btn {
      font-weigth: 700;
      font: 700 0.95rem/1.1 Inter, system-ui, sans-serif;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      border-radius: 999px;
      transition: none;
      border: 1px solid transparent;
      cursor: pointer;
      min-height: 52px;
      padding: 0 24px;
      white-space: nowrap;
      min-width: 180px;
    }

    .btn:hover {
      transform: none;
    }

    .uber {
      background: #000;
      color: #fff;
      border: 2px solid #fff;
      min-width: 180px;
    }

    .amazon {
      background: rgb(255, 216, 20);
      color: #111;
      box-shadow: 0 18px 34px rgba(255, 216, 20, 0.28);
      min-width: 240px;
    }

    .github {
      background: rgb(46, 164, 79);
      color: #fff;
      border-radius: 16px;
      min-width: 180px;
    }

    .bootstrap-primary {
      background: rgb(121, 82, 179);
      color: #fff;
      border-radius: 16px;
      min-width: 170px;
    }

    .bootstrap-secondary {
      background: #fff;
      color: rgb(108, 117, 125);
      border: 1px solid rgb(206, 212, 218);
      border-radius: 16px;
      min-width: 170px;
    }

    .linkedin-group {
      display: flex;
      gap: 10px;
      width: 100%;
      align-items: center;
      justify-content: center;
      border: 0px solid red;
    }

    .linkedin {
      background: rgb(10, 102, 194);
      color: #fff;
      flex: 1;
      padding: 0 28px;
    }

    .linkedin-alt {
      background: transparent;
      color: rgb(10, 102, 194);
      border: 1px solid rgb(10, 102, 194);
      min-width: 140px;
      font-weight: 700;
    }

    @media (max-width: 860px) {
      .top-row,
      .middle-row,
      .bottom-row {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 540px) {
      .composition {
        padding: 24px;
      }

      .btn {
        min-width: auto;
        width: 100%;
      }

      .linkedin-group {
        flex-direction: column;
      }

      .linkedin-alt {
        margin-left: 0;
      }
    }
  </style>
</head>
<body>
  <div class="composition">
    <div class="grid">
      <div>
        <h1>Famous Website</h1>
        <p>Uber, Amazon, GitHub, Bootstrap, and LinkedIn button styles</p>
      </div>

      <div class="top-row" id="top-row">
        <div class="panel extra-panel">
          <div class="button-frame">
            <a href="#" class="btn uber" style="bordr-radius: 16px;">Request now</a>
          </div>
        </div>
        <div class="panel">
          <div class="button-frame">
            <a href="#" class="btn amazon">Add to Cart</a>
          </div>
        </div>
        <div class="panel">
          <div class="button-frame">
            <a href="#" class="btn github">Sign up</a>
          </div>
        </div>
      </div>

      <div class="middle-row">
        <div class="panel" id="bootstrap-panel">
          <!-- new coder mistake: added extra padding with a <br> -->
          <br>
          <div class="button-frame button-group">
            <a href="#" class="btn bootstrap-primary">Get started</a>
            <a href="#" class="btn bootstrap-secondary">Download</a>
          </div>
        </div>
      </div>

      <div class="bottom-row">
        <div class="panel">
          <div class="linkedin-group">
            <a href="#" class="btn linkedin">Apply on company website</a>
            <a href="#" class="btn linkedin-alt">Save</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
